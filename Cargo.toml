[package]
name = "aurora-cli"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
readme = "README.cargo.md"
description = "Fast way to interact with Aurora OS."
repository = "https://gitcode.com/keygenqt_vz/aurora-cli"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru"]

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4"] }
clap-cargo = "0.18.3"
colored = "3.0.0"
inquire = "0.9.1"
ctrlc = "3.5.1"
walkdir = "2.5"
regex = "1.12"
rpm = "0.18.4"
tokio = "1.48.0"
russh = "0.54.5"
russh-sftp = "2.1.1"
